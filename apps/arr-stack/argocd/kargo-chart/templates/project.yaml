# +argocd:skip-file-rendering
#
# sync-wave "-1": the Project creates the namespace that the Warehouse, Stages
# and PromotionTask all live in, so it has to land before them on the first sync.
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: {{ .Values.appName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
