# Replicates the parts of akkoma-helm's "Lint and Test" GitHub Action worth
# re-checking at promotion time: does THIS exact chart version + image tag
# lint clean and render valid manifests. Deliberately doesn't replicate
# ct install (kind cluster) or the yamllint/Trivy config-scan steps -- those
# validate the chart's source and already gate every merge in akkoma-helm's
# own CI before the chart is ever published, so re-running them here would
# just repeat a check that already passed, not verify anything new about
# this freight.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: akkoma-chart-lint-test
  namespace: akkoma
spec:
  args:
  - name: chart-version
  - name: image-tag
  metrics:
  - name: chart-lint-and-render
    provider:
      job:
        spec:
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
              - name: chart-lint-test
                image: alpine/helm:3.16.4
                command:
                - sh
                - -c
                - |
                  set -eu
                  apk add --no-cache curl
                  curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
                    | tar xz -C /usr/local/bin kubeconform

                  helm pull oci://ghcr.io/adamancini/charts/akkoma \
                    --version "{{ args.chart-version }}" --untar --untardir /tmp/chart

                  helm lint --strict /tmp/chart/akkoma

                  # Mirrors the real overrides every environment sets (see
                  # apps/akkoma/argocd/appset.yaml / env/*/release.yaml) --
                  # rendering with only image.tag/domain/adminEmail would
                  # validate a shape nothing actually deploys.
                  helm template akkoma /tmp/chart/akkoma \
                    --set image.tag="{{ args.image-tag }}" \
                    --set akkoma.domain=verify.example.com \
                    --set akkoma.adminEmail=admin@verify.example.com \
                    --set externalSecret.enabled=true \
                    --set externalSecret.name=akkoma-secrets \
                    --set postgresql.existingSecret=akkoma-postgresql \
                    --set ingress.enabled=false \
                    > /tmp/rendered.yaml

                  # 1.35.5 matches the k3d-demo1/demo2 destination clusters
                  # (see apps/akkoma/argocd/appset.yaml) -- update this if
                  # the fleet's Kubernetes version changes.
                  kubeconform -strict -summary -ignore-missing-schemas \
                    -kubernetes-version 1.35.5 /tmp/rendered.yaml
