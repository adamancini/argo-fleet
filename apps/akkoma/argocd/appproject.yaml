apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: akkoma
  namespace: argocd
spec:
  description: Akkoma (Fediverse server), promoted via its published OCI Helm chart
  sourceRepos:
    - '*'
  destinations:
    - server: '*'
      name: '*'
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
