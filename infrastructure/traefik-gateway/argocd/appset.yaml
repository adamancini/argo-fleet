# One Application per cluster, installing Traefik configured as a Gateway
# API controller (not classic Ingress-only) -- mirrors fleet-infra's
# real-cluster setup, including the exact Gateway name ("traefik-gateway")
# its HTTPRoute resources already reference via parentRefs.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: traefik-gateway
  namespace: argocd
spec:
  generators:
  - clusters:
      selector:
        matchExpressions:
        - key: akuity.io/argo-cd-cluster-name
          operator: NotIn
          values: [in-cluster, kargo]
  template:
    metadata:
      name: 'traefik-gateway-{{name}}'
    spec:
      project: default
      source:
        repoURL: https://traefik.github.io/charts
        chart: traefik
        targetRevision: 41.1.1
        helm:
          valuesObject:
            ingressClass:
              enabled: true
              isDefaultClass: true
            providers:
              kubernetesCRD:
                enabled: true
              kubernetesIngress:
                enabled: true
              kubernetesGateway:
                enabled: true
                experimentalChannel: true
            gateway:
              enabled: true
              name: traefik-gateway
              listeners:
                web:
                  # Gateway API defaults allowedRoutes.namespaces.from to
                  # `Same`, and the chart leaves it unset -- so before this,
                  # the Gateway accepted HTTPRoutes from the `traefik`
                  # namespace ONLY. Verified on both live clusters:
                  #   kubectl get gateway traefik-gateway -n traefik \
                  #     -o jsonpath='{.spec.listeners}'
                  #   => [{"allowedRoutes":{"namespaces":{"from":"Same"}},...}]
                  # Every workload that wants in lives in its own namespace
                  # (monitoring, akkoma-*, soju-*), so without this a route
                  # attaches to nothing and fails with NotAllowedByListeners
                  # -- no error at apply time, just a 404 at request time.
                  # `All` matches how the still-enabled classic Ingress
                  # provider already behaves (no namespace restriction).
                  namespacePolicy:
                    from: All
            service:
              enabled: true
              type: LoadBalancer
      destination:
        name: '{{name}}'
        namespace: traefik
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
