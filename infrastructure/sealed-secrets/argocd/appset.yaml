# One Application per cluster, installing the upstream Sealed Secrets
# controller. The shared keypair (see Taskfile.yml's sealed-secrets:*
# tasks) is pre-created as a labeled Secret in the sealed-secrets namespace
# before this syncs -- the chart detects the existing secret and uses it
# instead of generating a new one.
#
# targetRevision must be "helm-vX.Y.Z", not "vX.Y.Z" -- this repo tags its
# Helm chart releases separately from the controller binary's own release
# tags, and only the "helm-" prefixed ones exist for the chart.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  generators:
  - clusters:
      selector:
        matchExpressions:
        - key: akuity.io/argo-cd-cluster-name
          operator: NotIn
          values: [in-cluster, kargo]
  template:
    metadata:
      name: 'sealed-secrets-{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/bitnami-labs/sealed-secrets.git
        targetRevision: helm-v2.16.1
        path: helm/sealed-secrets
        helm:
          valuesObject:
            fullnameOverride: sealed-secrets
      destination:
        name: '{{name}}'
        namespace: sealed-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
