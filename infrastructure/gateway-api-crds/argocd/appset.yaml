# One Application per cluster, installing the Gateway API CRDs (Gateway,
# HTTPRoute, GatewayClass, etc.) at the experimental channel -- the same
# version fleet-infra uses. Traefik's own chart doesn't install these; the
# traefik-gateway Application (infrastructure/traefik-gateway/) depends on
# them existing first.
#
# ServerSideApply is required: these CRDs' rendered manifests exceed
# kubectl client-side apply's 262144-byte last-applied-configuration
# annotation limit, which fails with a metadata.annotations "Too long"
# error. Server-side apply doesn't need that annotation at all.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gateway-api-crds
  namespace: argocd
spec:
  generators:
  - clusters:
      selector:
        matchExpressions:
        - key: akuity.io/argo-cd-cluster-name
          operator: NotIn
          values: [in-cluster, kargo]
  template:
    metadata:
      name: 'gateway-api-crds-{{name}}'
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      project: default
      source:
        repoURL: https://github.com/kubernetes-sigs/gateway-api.git
        targetRevision: v1.5.1
        path: config/crd/experimental
        directory:
          recurse: true
      destination:
        name: '{{name}}'
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - ServerSideApply=true
