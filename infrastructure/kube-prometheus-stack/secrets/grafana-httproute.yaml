---
# Exposes Grafana through the shared `traefik-gateway` Gateway that
# infrastructure/traefik-gateway installs in the `traefik` namespace. This is
# the first workload in the fleet actually wired to that Gateway.
#
# Lives in `secrets/` rather than `argocd/` for the same reason the Grafana
# SealedSecret next to it does: bootstrap/infra-apps.yaml syncs
# infrastructure/*/argocd wholesale to the `in-cluster` control plane, which
# is namespace-scoped to `argocd` and must not receive cluster-bound objects.
# The directory name is now a slight misnomer -- it holds "everything the
# workload clusters need that must stay out of the argocd/ glob", not only
# secrets -- but renaming it is unrelated churn.
#
# `hostnames` is deliberately OMITTED, which makes this match any Host header:
#
#   1. Nothing in this fleet resolves a real domain yet (no DNS, no TLS, no
#      cert-manager -- deferred fleet-wide, same reason akkoma/soju still use
#      placeholder *.example.com with ingress.enabled: false).
#   2. Files under a git `directory:` source are applied verbatim -- an
#      ApplicationSet templates the *Application* manifest, never the contents
#      of a directory source. So a per-cluster hostname
#      (grafana.demo1.example.com) is not expressible here at all without
#      switching this to a Helm/Kustomize source or forking a directory per
#      cluster. Omitting hostnames is the honest option, not just the easy one.
#
# Consequence worth knowing: with no hostname this is the gateway's catch-all
# backend, so any request to the LoadBalancer that no more-specific route
# claims lands on Grafana. Gateway API resolves hostname matches most-specific
# first, so a future route that does declare a hostname still wins for it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
  # The Gateway the traefik chart creates from `gateway.name`. Cross-namespace
  # attachment only works because that Gateway's `web` listener sets
  # allowedRoutes.namespaces.from: All -- Gateway API defaults it to `Same`,
  # which silently rejects this route with NotAllowedByListeners.
  - name: traefik-gateway
    namespace: traefik
    sectionName: web
  rules:
  # Service name is stable across clusters because the ApplicationSet pins
  # `helm.releaseName: kube-prometheus-stack`; port 80 is the grafana
  # subchart's `http-web` service port (targetPort 3000).
  - backendRefs:
    - name: kube-prometheus-stack-grafana
      port: 80
